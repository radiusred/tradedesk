name = "Pepperstone spread bet"
product = "spread_bet"
rollover = { tz = "America/New_York", time = "17:00" }
weekend.fx = { triple_day = "wednesday", days_on_triple = 3 }
weekend.metal = { triple_day = "wednesday", days_on_triple = 3 }
weekend.index = { triple_day = "friday", days_on_triple = 3 }

