# tradedesk-backtest cost configuration: a labelled EXAMPLE.
#
# Every venue figure in this file is illustrative. None is any real venue's spread,
# commission, financing rate or session, and none may be used for costed results. The
# file shows the schema and exercises every feature of it; the crate's tests use it.
#
# A real run loads its own file with the same schema: `tradedesk-backtest sweep
# --cost-config <PATH>`, `cost_config = "<PATH>"` in the sweep spec, or
# `CostConfig::from_path`. Without one, `CostConfig::builtin()` loads this file. Unknown
# fields are a load error. See the crate README, "Costs and financing", for the
# arithmetic.
#
# Units:
#   raw price   = the number on disk in the market-data cache
#   quote price = raw price x raw_scale
#   pip / point = pip_size in quote price; spread.pips, slippage.points and
#                 divergence_tolerance are in pips/points
#   commission  = account currency
#   rates       = annual fractions, positive = charged to the trader, negative = credited
#
# Provenance: each cost component (spread, slippage, commission, financing, carry) carries
# its own `source` and a status:
#   verified     placeholder = false: a published venue figure; in a real file the source
#                names the page, its URL and the date it was read.
#   placeholder  placeholder = true: an assumption or stand-in. A run with one is never
#                costed.
#   excluded     excluded = true + reason: the venue publishes no figure, so the component
#                charges nothing. An excluded spread or commission makes the venue x
#                instrument uncosted; excluded slippage, financing or carry leaves results
#                costed and lists what they omit.
# Here every `source` says the figure is an example. The statuses are set so that the
# file shows each of them; they make no claim about any venue.
# Every run records its venue's placeholders, exclusions, minimum spreads and a per-
# instrument `costed` flag in its metadata.
#
# Spreads: `basis` is "average" (the venue's average over a stated period) or "minimum"
# (a minimum, "from" or standard figure: results are a lower bound on spread cost). An
# optional `schedule` of local [from, to) windows in `tz` sets the spread by time of day;
# `pips` applies outside every window.
#
# Carry: the benchmark-rate or tom-next part of overnight funding. It is not modelled (no
# rate history), so it is excluded here: results charge the annual rate below to longs
# and shorts alike.
#
# The fill is the configured price side +/- half the `spread` below, +/- slippage, then
# commission. The data's own ask - bid is never the venue cost.

# ---------------------------------------------------------------------------------------
# Instruments: venue-independent units of the market-data cache.
#
# raw_scale verified against the cache on 2026-10-06: EURUSD 11036.6 = 1.10366,
# GBPJPY 17960.1 = 179.601, XAUUSD 206362.5 = $2063.625 (cents), USA500IDXUSD 4774.361
# points, DEUIDXEUR 17901.597 points.
#
# divergence_tolerance: largest bar |ask - bid| (pips/points) a fill accepts. Set at
# about 2-3x the largest open/close spread measured in the cache 2020-2026 (EURUSD 33.1,
# GBPJPY 99.5, XAUUSD 1492.7, USA500IDXUSD 7.3, DEUIDXEUR 30.0), so real rollover and
# news spikes pass and a scale or side corruption (orders of magnitude) fails.
# ---------------------------------------------------------------------------------------

[instruments.EURUSD]
asset_class = "fx"
quote_currency = "USD"
raw_scale = 0.0001
pip_size = 0.0001
divergence_tolerance = 100.0

[instruments.GBPJPY]
asset_class = "fx"
quote_currency = "JPY"
raw_scale = 0.01
pip_size = 0.01
divergence_tolerance = 300.0

[instruments.XAUUSD]
asset_class = "metal"
quote_currency = "USD"
raw_scale = 0.01
pip_size = 0.01          # $0.01: a gold spread quoted in dollars, 0.40 = 40 pips
divergence_tolerance = 3000.0

[instruments.USA500IDXUSD]
asset_class = "index"
quote_currency = "USD"
raw_scale = 1.0
pip_size = 1.0
divergence_tolerance = 20.0

[instruments.DEUIDXEUR]
asset_class = "index"
quote_currency = "EUR"
raw_scale = 1.0
pip_size = 1.0
divergence_tolerance = 60.0

# ---------------------------------------------------------------------------------------
# example_spread_bet: EXAMPLE figures. A spread bet that rolls at 22:00 Europe/London
# (moves with BST): flat FX spreads, a minimum gold spread, index spreads by time of day
# (one schedule wraps midnight), no commission, annual financing rates.
# ---------------------------------------------------------------------------------------

[venues.example_spread_bet]
name = "Example spread bet (illustrative figures)"
product = "spread_bet"
rollover = { tz = "Europe/London", time = "22:00" }
weekend.fx = { triple_day = "wednesday", days_on_triple = 3 }
weekend.metal = { triple_day = "friday", days_on_triple = 3 }
weekend.index = { triple_day = "friday", days_on_triple = 3 }

[venues.example_spread_bet.instruments.EURUSD]
price_side = "mid"
spread = { pips = 1.0, basis = "average", placeholder = false, source = "example figure, not a venue's" }
slippage = { placeholder = false, excluded = true, reason = "example: no slippage figure, so costed results omit it", source = "example, not a venue's" }
commission = { placeholder = false, source = "example: no commission" }
financing = { long_rate = 0.02, short_rate = 0.02, day_count = 360, placeholder = false, source = "example figure, not a venue's" }
carry = { placeholder = false, excluded = true, reason = "example: carry is not modelled, so costed results omit the interest differential", source = "example, not a venue's" }

[venues.example_spread_bet.instruments.GBPJPY]
price_side = "mid"
spread = { pips = 3.0, basis = "average", placeholder = false, source = "example figure, not a venue's" }
slippage = { placeholder = false, excluded = true, reason = "example: no slippage figure, so costed results omit it", source = "example, not a venue's" }
commission = { placeholder = false, source = "example: no commission" }
financing = { long_rate = 0.02, short_rate = 0.02, day_count = 360, placeholder = false, source = "example figure, not a venue's" }
carry = { placeholder = false, excluded = true, reason = "example: carry is not modelled, so costed results omit the interest differential", source = "example, not a venue's" }

[venues.example_spread_bet.instruments.XAUUSD]
price_side = "mid"
spread = { pips = 40.0, basis = "minimum", placeholder = false, source = "example figure, not a venue's: $0.40 = 40 x $0.01" }
slippage = { placeholder = false, excluded = true, reason = "example: no slippage figure, so costed results omit it", source = "example, not a venue's" }
commission = { placeholder = false, source = "example: no commission" }
financing = { long_rate = 0.02, short_rate = 0.02, day_count = 360, placeholder = false, source = "example figure, not a venue's" }
carry = { placeholder = false, excluded = true, reason = "example: carry is not modelled, so costed results omit the gold carry", source = "example, not a venue's" }

[venues.example_spread_bet.instruments.USA500IDXUSD]
price_side = "mid"
slippage = { placeholder = false, excluded = true, reason = "example: no slippage figure, so costed results omit it", source = "example, not a venue's" }
commission = { placeholder = false, source = "example: no commission" }
financing = { long_rate = 0.03, short_rate = 0.03, day_count = 360, placeholder = false, source = "example figure, not a venue's" }
carry = { placeholder = false, excluded = true, reason = "example: the benchmark rate is not modelled, so longs miss its charge and shorts miss its credit", source = "example, not a venue's" }

[venues.example_spread_bet.instruments.USA500IDXUSD.spread]
# London time: 14:30-21:00 0.5; 21:00-23:00 2.0; otherwise 1.0.
pips = 1.0
basis = "minimum"
tz = "Europe/London"
schedule = [
    { from = "14:30", to = "21:00", pips = 0.5 },
    { from = "21:00", to = "23:00", pips = 2.0 },
]
placeholder = false
source = "example figures, not a venue's: spread by time of day"

[venues.example_spread_bet.instruments.DEUIDXEUR]
price_side = "mid"
slippage = { placeholder = false, excluded = true, reason = "example: no slippage figure, so costed results omit it", source = "example, not a venue's" }
commission = { placeholder = false, source = "example: no commission" }
financing = { long_rate = 0.03, short_rate = 0.03, day_count = 360, placeholder = false, source = "example figure, not a venue's" }
carry = { placeholder = false, excluded = true, reason = "example: the benchmark rate is not modelled, so longs miss its charge and shorts miss its credit", source = "example, not a venue's" }

[venues.example_spread_bet.instruments.DEUIDXEUR.spread]
# London time: 22:00-01:00 6 (wraps midnight); 01:00-08:00 3; 08:00-16:30 1.5;
# 16:30-22:00 2.5. The windows cover the whole day, so `pips` is never used.
pips = 6.0
basis = "minimum"
tz = "Europe/London"
schedule = [
    { from = "22:00", to = "01:00", pips = 6.0 },
    { from = "01:00", to = "08:00", pips = 3.0 },
    { from = "08:00", to = "16:30", pips = 1.5 },
    { from = "16:30", to = "22:00", pips = 2.5 },
]
placeholder = false
source = "example figures, not a venue's: spread by time of day"

