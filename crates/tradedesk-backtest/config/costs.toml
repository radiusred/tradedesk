# ---------------------------------------------------------------------------------------
# Pepperstone (UK, Pepperstone Limited). Rollover 17:00 America/New_York (moves with EDT).
# Every page read 2026-10-07.
#
# Pepperstone "Trading costs and fees: spreads, commissions, swaps",
# https://pepperstone.com/en-gb/trading/costs-and-fees
#   Spread tables with "Razor min spread", "Standard min spread" and "Spread bet min
#   spread" columns (minimums only). Spread betting: "There's no commission to pay." Swaps
#   apply "on positions held past 5pm New York time (server time)"; the Wednesday triple
#   for T+2 pairs; "Indices and stocks typically factor in weekend financing on a Friday".
# Pepperstone "Costs and Charges Information & Examples", Pepperstone Ltd, version 9.0,
# September 2026,
# https://eu-assets.contentstack.com/v3/assets/bltd74737b907a31bbb/bltc19314db598b7ab0/UK_Legal_Costs_and_Charges.pdf
#   Razor and Standard minimum and average spreads (EURUSD, GER40, Spot Gold); Razor
#   commission on MT4/MT5 "GBP 2.25 (GBP 4.50 round turn)" per 1 lot (100 000 units),
#   Spot Gold "100 ounces" per lot; "commissions on index ... markets are reflected in the
#   spread, with no separate commission charge applied". Funding: FX and metals
#   "calculated by using the TomNext rate ... with an admin fee", where the "Funding Fee is
#   the TomNext rate annualised in points marked-up by up to 3%"; indices "(ARR +/- admin
#   fee)/360", "Admin fee is 2.5%". Server time: "5pm New York (23:59 Server Time)".
# Pepperstone "Costs and charges", Pepperstone Limited, March 2020,
# https://files.pepperstone.com/Pepperstone-Limited-Cost-and-Charges.pdf
#   Razor minimum and average spreads for every FX pair (GBPJPY), and index minimum
#   spreads by session in server time (US500).
# The two documents cover the Razor and Standard CFD accounts; the spread-bet product has
# only the costs-and-fees page's minimums. The funding formulas are applied to both.
#
# Weekend: FX Wednesday, metals Wednesday (T+2), indices Friday (Decision on #30).
# ---------------------------------------------------------------------------------------

