price_side = "mid"
spread = { pips = 1.04, basis = "average", placeholder = false, source = "IG Forex spread betting product details, https://www.ig.com/uk/help-and-support/articles/681881-forex-spread-betting-product-details, read 2026-10-07: EUR/USD average spread 1.04 (Mon 00:00-Fri 22:00 GMT, 12 weeks to 2021-01-08); minimum 0.6, 00:00-21:00 GMT average 0.85" }
slippage = { placeholder = false, excluded = true, reason = "no venue-published slippage figure: no slippage is charged, so costed results omit it", source = "IG What are the fees and costs of spread betting and CFD trading?, https://www.ig.com/uk/help-and-support/articles/681705-what-are-the-fees-and-costs-of-spread-betting-and-cfd-trading, read 2026-10-07: spreads, commission and funding only" }
commission = { placeholder = false, source = "IG What are the fees and costs of spread betting and CFD trading?, https://www.ig.com/uk/help-and-support/articles/681705-what-are-the-fees-and-costs-of-spread-betting-and-cfd-trading, read 2026-10-07: commission only on CFD share trading" }
financing = { long_rate = 0.015, short_rate = 0.015, day_count = 360, placeholder = false, source = "IG What is overnight funding, how is it charged and how is it calculated?, https://www.ig.com/uk/help-and-support/articles/681712-what-is-overnight-funding-how-is-it-charged-and-how-is-it-calculated, read 2026-10-07: forex admin fee 1.5%; divisor 360 per the page's non-GBP rule" }
carry = { placeholder = false, excluded = true, reason = "the tom-next rate has no history in the config: costed results omit the EUR/USD interest differential (a credit or a debit)", source = "IG What is overnight funding, how is it charged and how is it calculated?, https://www.ig.com/uk/help-and-support/articles/681712-what-is-overnight-funding-how-is-it-charged-and-how-is-it-calculated, read 2026-10-07: 'the tom-next rate plus an admin fee of 1.5%'" }

