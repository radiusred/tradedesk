# tradedesk-backtest venue cost configuration (task #30, M1-R2 / M1-R3; figures sourced in task #58,
# M2-R1).
#
# Loaded by `CostConfig::builtin()`; a run may load its own file with the same schema via
# `CostConfig::from_path`. Unknown fields are a load error. See the crate README,
# "Costs and financing", for the arithmetic.
#
# Units:
#   raw price   = the number on disk in the market-data cache
#   quote price = raw price x raw_scale
#   pip / point = pip_size in quote price; spread.pips, slippage.points and
#                 divergence_tolerance are in pips/points
#   commission  = account currency (GBP)
#   rates       = annual fractions, positive = charged to the trader, negative = credited
#
# Provenance: each cost component (spread, slippage, commission, financing, carry) carries
# its own `source` and a status:
#   verified     placeholder = false: a published venue figure; the source names the
#                page, its URL and the date it was read.
#   placeholder  placeholder = true: an assumption or stand-in. A run with one is never
#                costed. None remains below.
#   excluded     excluded = true + reason: the venue publishes no figure, so the component
#                charges nothing. An excluded spread or commission makes the venue x
#                instrument uncosted; excluded slippage, financing or carry leaves results
#                costed and lists what they omit.
# Every run records its venue's placeholders, exclusions, minimum spreads and a per-
# instrument `costed` flag in its metadata.
#
# Spreads: `basis` is "average" (the venue's average over a stated period) or "minimum"
# (a minimum, "from" or standard figure: results are a lower bound on spread cost). An
# optional `schedule` of local [from, to) windows in `tz` sets the spread by time of day;
# `pips` applies outside every window (issue #52).
#
# Carry: the benchmark-rate or tom-next part of overnight funding. It is not modelled (no
# rate history), so it is excluded everywhere: costed results charge each venue's annual
# admin fee to longs and shorts alike. Against the venue, a long is under-charged by the
# benchmark rate, a short is over-charged by it (an index short is normally credited
# benchmark minus fee), and the FX/gold interest differential (a credit or a debit) is
# missing.
#
# Venue cost is never the Dukascopy ask - bid (Decision on issue #28): the fill is the
# configured price side +/- half the `spread` below, +/- slippage, then commission.

# ---------------------------------------------------------------------------------------
# Instruments: venue-independent units.
#
# raw_scale verified against the cache on 2026-10-06: EURUSD 11036.6 = 1.10366,
# GBPJPY 17960.1 = 179.601, XAUUSD 206362.5 = $2063.625 (cents), USA500IDXUSD 4774.361
# points, DEUIDXEUR 17901.597 points.
#
# divergence_tolerance: largest bar |ask - bid| (pips/points) a fill accepts. Set at
# about 2-3x the largest open/close spread measured in the cache 2020-2026 (EURUSD 33.1,
# GBPJPY 99.5, XAUUSD 1492.7, USA500IDXUSD 7.3, DEUIDXEUR 30.0), so real rollover and
# news spikes pass and a scale or side corruption (orders of magnitude) fails.
# ---------------------------------------------------------------------------------------

[instruments.EURUSD]
asset_class = "fx"
quote_currency = "USD"
raw_scale = 0.0001
pip_size = 0.0001
divergence_tolerance = 100.0

[instruments.GBPJPY]
asset_class = "fx"
quote_currency = "JPY"
raw_scale = 0.01
pip_size = 0.01
divergence_tolerance = 300.0

[instruments.XAUUSD]
asset_class = "metal"
quote_currency = "USD"
raw_scale = 0.01
pip_size = 0.01          # $0.01: IG and Pepperstone quote gold spreads in dollars (0.3 = 30 pips)
divergence_tolerance = 3000.0

[instruments.USA500IDXUSD]
asset_class = "index"
quote_currency = "USD"
raw_scale = 1.0
pip_size = 1.0
divergence_tolerance = 20.0

[instruments.DEUIDXEUR]
asset_class = "index"
quote_currency = "EUR"
raw_scale = 1.0
pip_size = 1.0
divergence_tolerance = 60.0

# ---------------------------------------------------------------------------------------
# IG, UK spread bet. Every page read 2026-10-07.
#
# Rollover 22:00 Europe/London (moves with BST). IG "What is overnight funding, how is it
# charged and how is it calculated?",
# https://www.ig.com/uk/help-and-support/articles/681712-what-is-overnight-funding-how-is-it-charged-and-how-is-it-calculated
#   "For forex and spot metals deals, we charge the tom-next rate plus an admin fee of
#    1.5%." Index spread bet: "Bet size x price x (3.4% admin fee +/- SONIA%) / 365",
#   "365-day divisor used for the FTSE 100 and other GBP, SGD and ZAR denominated markets.
#    360-day divisor used for all other markets." Weekend: Wednesday for forex (T+2),
#   Friday otherwise (Decision on #30, unchanged).
#   The page states no divisor for the FX/metals admin fee; its own rule for non-GBP
#   markets (360) is applied, the larger daily charge.
#   Two IG product-details notes disagree with the 1.5% for spot gold (commodities page
#   note 3: "admin fee of 1% per annum"; note 5a: "0.8% per annum") and the forex page
#   note 6 gives "0.0022% per day" (about 0.8% a year). The dedicated funding page, the
#   highest figure, is used (Decision on #58).
#
# Spreads (Decision on #58 resolving #52):
#   FX: IG "Forex spread betting product details",
#   https://www.ig.com/uk/help-and-support/articles/681881-forex-spread-betting-product-details
#   gives per pair a minimum spread, an average 00:00-21:00 GMT and an average "Monday
#   00:00 - Friday 22:00 GMT for the 12 weeks ending 8th January 2021". The all-hours
#   average is used. (The same table, with the same figures, is IG's forex CFD product
#   details, where it sits under "Major" spot pairs.)
#   Indices: IG "Spread bet Indices product details",
#   https://www.ig.com/uk/help-and-support/articles/682128-spread-bet-indices-product-details
#   publishes the DFB spread by time period (London time); used as a schedule.
#   Spot gold: IG "Commodities spread bet product details",
#   https://www.ig.com/uk/help-and-support/articles/681833-commodities-spread-bet-product-details
#   "Standard spread" 0.3 (one point = $1/oz), with no average or time periods.
#
# Commission: IG "What are the fees and costs of spread betting and CFD trading?",
# https://www.ig.com/uk/help-and-support/articles/681705-what-are-the-fees-and-costs-of-spread-betting-and-cfd-trading
#   "Our spread charges apply to trades for all markets except CFD share trading, where a
#    commission is charged instead"; "Commissions are charged when trading shares using a
#    CFD account".
# Slippage: neither page above, nor IG "Costs and Charges on Spread Bets, CFDs, and US
# Options and Futures" (https://www.ig.com/uk/charges), publishes a
# slippage figure.
# ---------------------------------------------------------------------------------------

[venues.ig_spread_bet]
name = "IG spread bet"
product = "spread_bet"
rollover = { tz = "Europe/London", time = "22:00" }
weekend.fx = { triple_day = "wednesday", days_on_triple = 3 }
weekend.metal = { triple_day = "friday", days_on_triple = 3 }
weekend.index = { triple_day = "friday", days_on_triple = 3 }

