name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Forbid internal ticket references (RAD-nnn)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            msgs=$(git log --format='%s%n%b' "origin/${{ github.base_ref }}..HEAD")
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              msgs=$(git log --format='%s%n%b' -1 "$after")
            else
              msgs=$(git log --format='%s%n%b' "${before}..${after}")
            fi
          fi
          bad=$(printf '%s' "$msgs" | grep -E 'RAD-[0-9]+' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit message(s) contain internal ticket reference(s):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK – no internal ticket references found."

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra ml

      - name: Run mypy
        run: uv run mypy tradedesk

      - name: Run ruff
        run: uv run ruff check tradedesk

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra ml

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=tradedesk \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Phase 6 leakage gate (tradedesk/ml/)
        # Re-runs the @pytest.mark.leakage suite as a separately-named CI step
        # so a leakage regression is the failing check on the PR rather than
        # a buried line in the main test step. Cheap to re-run because the
        # same marker is also in the main suite (no extra ML deps to install).
        run: uv run pytest -m leakage --no-cov