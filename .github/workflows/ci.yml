name: CI
# CI runs on pull_request only. The post-merge `push: branches: [main]` trigger
# was removed: every feature/release PR already runs the full
# matrix as the merge gate, and rebase-merge means no semantic-merge surprises,
# so re-running on the push to main only doubled GHA spend.
#
# Cost-saving for docs-only changes is done with the `changes` path-filter job
# below (NOT with `[skip ci]` and NOT with workflow-level `paths-ignore`).
# A workflow-level path filter would skip the WHOLE workflow on a docs commit,
# which means the required `Lint commit messages` status check would never
# report and the PR could never merge. Instead the heavy jobs (`typecheck`,
# `test`) are gated per-job on whether any non-docs file changed, while
# `lint-commits` always runs so the required check always reports.
on:
  pull_request:

jobs:
  lint-commits:
    name: Lint commit messages
    # Always runs — no path/branch guard and no `[skip ci]` bypass — so the
    # required `Lint commit messages` status check reports on every PR
    # (including docs-only and release/* PRs). This is the gate that keeps
    # internal ticket references out of this public repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Forbid internal ticket references (RAD-nnn)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            msgs=$(git log --format='%s%n%b' "origin/${{ github.base_ref }}..HEAD")
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              msgs=$(git log --format='%s%n%b' -1 "$after")
            else
              msgs=$(git log --format='%s%n%b' "${before}..${after}")
            fi
          fi
          bad=$(printf '%s' "$msgs" | grep -E 'RAD-[0-9]+' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit message(s) contain internal ticket reference(s):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK – no internal ticket references found."

  changes:
    name: Detect non-docs changes
    # Computes whether the PR touches anything other than docs. Heavy jobs key
    # off `outputs.code`. The default is safe: anything that is NOT a recognised
    # docs path counts as code, so a missed pattern over-runs CI (wasteful) but
    # never lets a code change skip the test matrix (dangerous).
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine if any non-docs file changed
        id: filter
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          printf '%s\n' "$files"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # In `case`, `*` matches across `/`, so `docs/*` covers docs/examples/...
            case "$f" in
              *.md|docs/*|LICENSE|NOTICE) ;;   # docs → ignore for heavy CI
              *) code=true ;;                   # anything else → run heavy CI
            esac
          done <<EOF
          $files
          EOF
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Non-docs changes present: $code"

  typecheck:
    name: Type check
    needs: changes
    # Skip on docs-only PRs (path filter) and on automated release version-bump
    # PRs (release/*): the latter only change the __version__ string against code
    # that already passed CI on its feature PRs.
    if: ${{ needs.changes.outputs.code == 'true' && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra ml

      - name: Run mypy
        run: uv run mypy tradedesk

      - name: Run ruff
        run: uv run ruff check tradedesk

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: [changes, typecheck]
    if: ${{ needs.changes.outputs.code == 'true' && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra ml

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=tradedesk \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Phase 6 leakage gate (tradedesk/ml/)
        # Re-runs the @pytest.mark.leakage suite as a separately-named CI step
        # so a leakage regression is the failing check on the PR rather than
        # a buried line in the main test step. Cheap to re-run because the
        # same marker is also in the main suite (no extra ML deps to install).
        run: uv run pytest -m leakage --no-cov
