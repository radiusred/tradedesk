name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  library-suitability:
    name: Public-library suitability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject deployment-platform strings in library source
        run: |
          # Fail if any deployment-platform-specific string appears in library Python source.
          # These strings signal that code is coupled to a specific deployment environment,
          # which is never acceptable in a public open-source library.
          # Docs, config files, and tests are excluded.
          patterns=(
            "Cloud Run"
            "cloud run"
            "GCP"
            "Google Cloud"
            "AWS"
            "Azure"
            "Kubernetes"
            "kubernetes"
            "container restart"
            "systemd"
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if grep -rn --include="*.py" "$pattern" tradedesk/; then
              echo "ERROR: deployment-platform string '$pattern' found in library source."
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Library source must not reference deployment platforms."
            echo "See CONTRIBUTING.md for the public-library contract."
            exit 1
          fi

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run mypy
        run: uv run mypy tradedesk

      - name: Run ruff
        run: uv run ruff check tradedesk

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=tradedesk \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85