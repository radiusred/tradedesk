name: Container Image Build

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke test — tradedesk imports
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -c "import tradedesk; print(f'tradedesk {tradedesk.__version__} ok')"

      - name: Push container image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger infrastructure deploy
        if: success()
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.sha_short }}
          INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$INFRA_TOKEN" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN secret not configured — skipping deploy trigger"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $INFRA_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/radiusred/infrastructure/dispatches \
            -d "{\"event_type\":\"container-built\",\"client_payload\":{\"image_tag\":\"${IMAGE_TAG}\",\"repository\":\"${GITHUB_REPOSITORY}\"}}"
