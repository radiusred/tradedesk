name: Prepare Release

on:
  workflow_dispatch:

jobs:
  call-reusable-release:
    uses: radiusred/.github/.github/workflows/reusable-release.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      approval_environment: release-approval
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
