[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tradedesk"
dynamic = ["version"]

authors = [
  { name = "Radius Red Ltd.", email = "opensource@radiusred.uk" }
]
maintainers = [
  { name = "Radius Red Ltd.", email = "opensource@radiusred.uk" }
]
description = "Trading infrastructure library with backtesting"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "NOTICE*"]
dependencies = [
    "aiohttp>=3.9.0",
    "requests>=2.31",
    "lightstreamer-client-lib>=2.0",
    "python-dotenv>=1.0",
    "numpy>=2.4.0",
    "jinja2>=3.1.0",
    "pandas>=3.0.1",
    "zstandard>=0.25",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "pandas-stubs[dev]>=3.0.0.260204",
    "types-seaborn[dev]>=0.13.2.20251221",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5",
    "mypy>=1.19",
    "ruff>=0.15",
    "pytest>=8.0",
    "responses>=0.25",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "llm-tldr[dev]>=1.5.2",
    "prometheus_client>=0.19",
]
ml = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.urls]
Homepage = "https://github.com/radiusred"
Repository = "https://github.com/radiusred/tradedesk"
Issues = "https://github.com/radiusred/tradedesk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["tradedesk"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.hatch.build.targets.wheel]
packages = ["tradedesk"]

[tool.hatch.version]
path = "tradedesk/__init__.py"

[tool.mypy]
python_version = "3.11"
strict = true
implicit_reexport = false
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "docs.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["prometheus_client"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["xgboost", "xgboost.*", "sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/F: Defaults, I: Import Sorting, TID: Tidy Imports
select = ["E", "F", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 1. Ban direct access to submodules by default
"tradedesk.execution.*".msg = "Use 'from tradedesk.execution import ...' instead."
"tradedesk.marketdata.*".msg = "Use 'from tradedesk.marketdata import ...' instead."
"tradedesk.portfolio.*".msg = "Use 'from tradedesk.portfolio import ...' instead."
"tradedesk.recording.*".msg = "Use 'from tradedesk.recording import ...' instead."
"tradedesk.strategy.*".msg = "Use 'from tradedesk.strategy import ...' instead."

[tool.ruff.lint.per-file-ignores]
# 2. Allow modules WITHIN a package to import their own submodules
"tradedesk/marketdata/*" = ["TID251"]
"tradedesk/execution/*" = ["TID251"]
"tradedesk/strategy/*" = ["TID251"]
"tradedesk/portfolio/*" = ["TID251"]
"tradedesk/recording/*" = ["TID251"]
"tradedesk/ml/*" = ["TID251"]
# 3. Allow relative import to top level to prevent circular deps
"tradedesk/**/*.py" = ["TID252"]
